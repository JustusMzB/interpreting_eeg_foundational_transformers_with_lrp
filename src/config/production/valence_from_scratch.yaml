# Optimal hyperparameters identified during research optimization searches (via Optuna).
# Foundational Model Configs
finetune_ckpt: null # No checkpoint for training from scratch

# Data/Task Specific configs
dataset: brain_heart_valence
nb_classes: 2
task_type: binary
label_type: patchwise
in_channels: 60
dataset_path: src/data/brain_heart_emotion
data_dir: data/brain_heart_emotion
EEG_size: 800

# Training Configs
num_workers: 24
epochs: 100
batch_size: 64
drop_rate: 0.821
drop_path_rate: 0.821
attn_drop_rate: 0.821
weight_decay: 3.6e-06
lr: 5.0e-04

# Output Configs
output_dir: output
