searchspace: 
  batch_size:
    type: categorical
    choices: [ 32, 64, 128, 256 ]
  dropout:
    type: float
    low: 0.1
    high: 0.99
    kwarg_names:
      - drop_rate
      - drop_path_rate
      - attn_drop_rate
  weight_decay:
    type: float
    low: 1e-6
    high: 0.01
    log: true
  binary_class_weight:
    type: float
    low: 5
    high: 8
    log: False
    kwarg_names:
      - class_weights